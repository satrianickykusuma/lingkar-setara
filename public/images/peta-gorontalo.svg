<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Peta lokasi Lingkar Setara di Jalan Tondano, Kota Gorontalo">
  <title>Peta lokasi Lingkar Setara</title>
  <rect width="640" height="420" fill="#eaf2e6"/>

  <!-- garden / green blocks -->
  <rect x="28" y="34" width="150" height="98" rx="10" fill="#dcebd3"/>
  <rect x="470" y="60" width="140" height="120" rx="10" fill="#dcebd3"/>
  <rect x="60" y="286" width="180" height="98" rx="10" fill="#dcebd3"/>
  <rect x="420" y="300" width="180" height="88" rx="10" fill="#dcebd3"/>

  <!-- water -->
  <path d="M0 214 C120 196, 220 236, 340 214 C450 194, 540 232, 640 210 L640 250 C540 272, 450 236, 340 256 C220 278, 120 238, 0 256 Z" fill="#cfe9f7"/>

  <!-- major roads -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M0 170 H640" stroke-width="22"/>
    <path d="M330 0 V420" stroke-width="20"/>
    <path d="M0 350 H640" stroke-width="14"/>
    <path d="M120 0 V420" stroke-width="12"/>
  </g>

  <!-- road casings -->
  <g stroke="#c7dbc0" stroke-linecap="round" fill="none" stroke-width="2">
    <path d="M0 170 H640"/>
    <path d="M330 0 V420"/>
    <path d="M0 350 H640"/>
    <path d="M120 0 V420"/>
    <path d="M0 92 H250"/>
    <path d="M470 0 V160"/>
    <path d="M200 420 V268"/>
  </g>

  <!-- street labels -->
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5c6b57">
    <text x="24" y="164">Jl. Drs. H. Ahmad Arbie</text>
    <text x="340" y="40" transform="rotate(90 340 40)">Jl. Tondano</text>
    <text x="24" y="344">Jl. Molosipat</text>
    <text x="24" y="86">Kel. Molosipat U</text>
    <text x="482" y="54">Sipatana</text>
  </g>

  <!-- destination marker -->
  <g transform="translate(330 170)">
    <circle r="30" fill="#0066ff" opacity="0.14"/>
    <circle r="18" fill="#0066ff" opacity="0.22"/>
    <path d="M0 -26 C-9 -26 -16 -19 -16 -10 C-16 2 0 18 0 18 C0 18 16 2 16 -10 C16 -19 9 -26 0 -26 Z" fill="#0066ff" stroke="#ffffff" stroke-width="3"/>
    <circle cy="-11" r="5.5" fill="#ffffff"/>
  </g>

  <!-- label plate -->
  <g transform="translate(360 196)">
    <rect width="216" height="34" rx="8" fill="#ffffff" opacity="0.94"/>
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f2f57">Lingkar Setara</text>
  </g>

  <!-- attribution -->
  <text x="632" y="410" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#5c6b57">Peta ilustrasi — bukan skala sebenarnya</text>
</svg>
